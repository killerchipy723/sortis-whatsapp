<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortis Motos - Acceso Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { border: none; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; background: white; padding: 2rem; }
    </style>
</head>
<body>
    <div class="card-login">
        <div class="text-center mb-4">
            <h4 class="fw-bold text-dark">Panel Admin</h4>
            <p class="text-muted small">Sortis Motos - Gestión Web</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('admin_login') }}" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Contraseña de Administrador</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-success fw-bold py-2 rounded-pill">Ingresar al Panel</button>
            </div>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('landing') }}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"><b></b></i> Volver al sitio web</a>
        </div>
    </div>
</body>
</html>
